<!doctype html>
<html lang="es" class="bg-background">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo_university.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e2b21" />
    <meta name="description" content="Inicia sesión en EMERGE, tu plataforma educativa." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Universidad EMERGE</title>
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: #f1f6f1;
        font-family: Inter, system-ui, sans-serif;
      }
      .boot img {
        width: 64px;
        height: 64px;
        object-fit: contain;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-bar {
        width: 160px;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(30, 91, 58, 0.12);
      }
      .boot-bar span {
        display: block;
        height: 100%;
        border-radius: 999px;
        background: #1e5b3a;
        animation: boot-bar 1.3s ease-in-out infinite;
      }
      .boot p {
        margin: 0;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #6b7d70;
      }
      @keyframes boot-pulse {
        50% {
          transform: scale(0.94);
          opacity: 0.75;
        }
      }
      @keyframes boot-bar {
        0% {
          transform: translateX(-100%) scaleX(0.4);
        }
        50% {
          transform: translateX(40%) scaleX(0.6);
        }
        100% {
          transform: translateX(160%) scaleX(0.4);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot img,
        .boot-bar span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Pantalla de arranque: se ve mientras descarga el JS; React la reemplaza al montar. -->
      <div class="boot">
        <img src="/images/logo-emerge.png" alt="" />
        <div class="boot-bar"><span></span></div>
        <p>Universidad Emerge</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
